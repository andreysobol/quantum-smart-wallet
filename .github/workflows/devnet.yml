name: devnet

permissions: {}

on:
  push:
    paths:
      - "infra/**"
      - "demo/**"
      - "slhsol/script/simulate_native.py"
      - ".github/workflows/devnet.yml"
  pull_request:
    paths:
      - "infra/**"
      - "demo/**"
      - "slhsol/script/simulate_native.py"
      - ".github/workflows/devnet.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Check bootstrap and persistent runtime configuration
        run: |
          bash -n infra/devnet/bootstrap_on_vps.sh
          python3 infra/devnet/test_sanity.py
      - name: Check signer error privacy
        run: python3 -m unittest discover -s demo -p 'test_*.py'
      - name: Check HTTP and WebSocket gateway policy
        run: >-
          docker run --rm --volume "$PWD:/repo:ro" --workdir /repo
          oven/bun@sha256:1d22548f177f4ff38e0c15baa3c2c46c6c2060ba2d1bc573bb4720b407548f1d
          bun test infra/gateway
