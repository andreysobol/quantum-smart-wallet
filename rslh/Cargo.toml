[package]
name = "rslh"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "Educational NIST FIPS 205 SLH-DSA-SHA2-128s (default) and SLH-DSA-SHAKE-128s, with separate Lean models"

[dependencies]
sha3 = "0.10"
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"

[profile.test]
opt-level = 2

[[bin]]
name = "rslh"
path = "src/main.rs"
